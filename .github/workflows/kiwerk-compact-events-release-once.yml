name: KIWERK compact schedule - one-time SFTP release

on:
  push:
    branches:
      - release/compact-events-20261123
    paths:
      - .github/workflows/kiwerk-compact-events-release-once.yml

permissions:
  contents: read

concurrency:
  group: ionos-sftp
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Thumaz123/kiwerkos-website' && github.ref == 'refs/heads/release/compact-events-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the approved code and full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Confirm branch contains the reviewed compact-schedule change
        run: git merge-base --is-ancestor 5abf5916793facb5222cde3643801650f99dc572 HEAD
      - name: Generate the current dates
        run: python3 scripts/rollforward_website.py
      - name: Check calendar rules and website assets
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 build_deploy.py --check
          node --check landingpage/assets/js/events.js
      - name: Install SFTP dependency
        run: sudo apt-get update && sudo apt-get install -y python3-paramiko
      - name: Back up and upload only three approved schedule files
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          SFTP_WEBROOT: ${{ secrets.SFTP_WEBROOT }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: /usr/bin/python3 .github/scripts/deploy_compact_events_once.py
      - name: Compare all three public files against the release
        run: |
          python3 - <<'PY'
          import time
          import urllib.request
          from pathlib import Path

          for name in ("assets/css/events.css", "assets/js/events.js", "index.html"):
              expected = (Path("landingpage") / name).read_bytes()
              for attempt in range(4):
                  url = "https://www.kiwerk-os.de/" + name + "?verify_compact=" + str(int(time.time()))
                  req = urllib.request.Request(url, headers={
                      "User-Agent": "KIWERK-compact-events-release/1.0",
                      "Cache-Control": "no-cache"})
                  try:
                      with urllib.request.urlopen(req, timeout=25) as response:
                          if response.status == 200 and response.read() == expected:
                              print("Verified public file:", name, flush=True)
                              break
                  except Exception:
                      pass
                  if attempt == 3:
                      raise ValueError("Public file verification failed: " + name)
                  time.sleep(6)
          PY
