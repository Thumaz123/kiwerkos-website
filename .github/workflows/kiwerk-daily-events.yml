name: KIWERK daily event rollforward

on:
  push:
    branches: [main]
    # One initial deployment when the event workflow is enabled or repaired.
    paths:
      - '.github/workflows/kiwerk-daily-events.yml'
      - 'landingpage/assets/js/events.js'
      - 'landingpage/assets/js/events-data.js'
      - 'scripts/rollforward_website.py'
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/kiwerk-daily-events.yml'
      - '.github/scripts/publish_schedule.py'
      - 'landingpage/index.html'
      - 'landingpage/treffen/index.html'
      - 'landingpage/assets/js/events.js'
  schedule:
    # 02:15 UTC = 03:15 CET / 04:15 CEST; always before Friday morning.
    - cron: '15 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ionos-sftp
  cancel-in-progress: false

jobs:
  rollforward:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out published version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Generate event HTML for current date in Europe/Berlin
        run: python3 scripts/rollforward_website.py
      - name: Validate calendar rules
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate website package
        run: python3 build_deploy.py --check
      - name: Prepare SFTP client
        if: github.event_name != 'pull_request'
        run: sudo apt-get update && sudo apt-get install -y python3-paramiko
      - name: Publish only event HTML pages to IONOS
        if: github.event_name != 'pull_request'
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          SFTP_WEBROOT: ${{ secrets.SFTP_WEBROOT }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: /usr/bin/python3 .github/scripts/publish_schedule.py
      - name: Verify public event pages match generated files
        if: github.event_name != 'pull_request'
        run: |
          python3 - <<'PY'
          import time
          import urllib.request
          from pathlib import Path
          files = (
              ("https://www.kiwerk-os.de/", Path("landingpage/index.html")),
              ("https://www.kiwerk-os.de/treffen/", Path("landingpage/treffen/index.html")),
              ("https://www.kiwerk-os.de/assets/js/events.js", Path("landingpage/assets/js/events.js")),
              ("https://www.kiwerk-os.de/assets/js/events-data.js", Path("landingpage/assets/js/events-data.js")),
          )
          for url, local in files:
              expected = local.read_bytes()
              for attempt in range(4):
                  req = urllib.request.Request(
                      url + "?kiwerk_check=" + str(int(time.time())),
                      headers={"User-Agent": "KIWERK-website-schedule-verifier/1.0", "Cache-Control": "no-cache"})
                  with urllib.request.urlopen(req, timeout=25) as resp:
                      live = resp.read()
                      if resp.status == 200 and live == expected:
                          print("Public page matches generated HTML:", url)
                          break
                  if attempt == 3:
                      raise ValueError("Live page differs from generated version: " + url)
                  time.sleep(10)
          PY
