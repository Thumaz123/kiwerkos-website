name: KIWERK Brevo account audit (read-only)

on:
  workflow_dispatch:
  schedule:
    - cron: '45 4 * * 1'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify existing Brevo recipient list and sender
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: python3 scripts/brevo_audit.py
