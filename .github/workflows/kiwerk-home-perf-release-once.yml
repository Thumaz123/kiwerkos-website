name: KIWERK homepage performance - one-time SFTP release
on:
  push:
    branches:
      - release/home-perf-20261123
    paths:
      - .github/workflows/kiwerk-home-perf-release-once.yml

permissions:
  contents: read

concurrency:
  group: ionos-sftp
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Thumaz123/kiwerkos-website' && github.ref == 'refs/heads/release/home-perf-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed website and release code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Confirm the approved homepage fix is present
        run: git merge-base --is-ancestor 1f06c12bca1c38256e1ced3dd293a60329226168 HEAD
      - name: Refresh dates without changing reviewed homepage code
        run: python3 scripts/rollforward_website.py
      - name: Check schedule rules and the complete deploy package
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 build_deploy.py --check
          node --check landingpage/assets/js/home.js
      - name: Install SFTP dependency
        run: sudo apt-get update && sudo apt-get install -y python3-paramiko
      - name: Backup and publish exactly two homepage files
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          SFTP_WEBROOT: ${{ secrets.SFTP_WEBROOT }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: /usr/bin/python3 .github/scripts/deploy_home_perf_once.py
      - name: Verify both public files match the released version
        run: |
          python3 - <<'PY'
          import time
          import urllib.request
          from pathlib import Path

          for name in ("assets/js/home.js", "index.html"):
              expected = (Path("landingpage") / name).read_bytes()
              for attempt in range(4):
                  req = urllib.request.Request(
                      "https://www.kiwerk-os.de/" + name + "?verify_perf=" + str(int(time.time())),
                      headers={"User-Agent": "KIWERK-homepage-performance-release/1.0", "Cache-Control": "no-cache"})
                  try:
                      with urllib.request.urlopen(req, timeout=25) as response:
                          if response.status == 200 and response.read() == expected:
                              print("Verified public file:", name, flush=True)
                              break
                  except Exception:
                      pass
                  if attempt == 3:
                      raise ValueError("Public file failed exact-content verification: " + name)
                  time.sleep(6)
          PY
